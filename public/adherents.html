<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adherents - Bibliotheque de quartier</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav>
    <a href="index.html">Tableau de bord</a>
    <a href="livres.html">Livres</a>
    <a href="adherents.html">Adherents</a>
    <a href="emprunts.html">Emprunts</a>
  </nav>

  <main>
    <h1>Adherents</h1>

    <h2>Ajouter un adherent</h2>
    <form id="form-adherent">
      <label for="nom">Nom</label>
      <input type="text" id="nom" placeholder="Ex: Pangui-Mafoubou" required>

      <label for="contact">Contact</label>
      <input type="number" id="contact" placeholder="Ex: 067446310" required>

      <button type="submit">Ajouter l'adherent</button>
      <p class="message-erreur" id="erreur-adherent"></p>
    </form>

    <h2>Liste des adherents</h2>
    <table>
      <thead>
        <tr>
          <th>Nom</th>
          <th>Contact</th>
        </tr>
      </thead>
      <tbody id="liste-adherents">
        <tr><td colspan="2">Chargement...</td></tr>
      </tbody>
    </table>
  </main>

  <script src="js/api.js"></script>
  <script src="js/adherents.js"></script>
</body>
</html>
